<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Pharma Forward">
  <!--
    The specification band, reduced to a mark.

    Same idea as the hero: a process trace climbing into an acceptance range
    and settling on target. Drawn for 16px rather than for this listing — at
    tab size only the heaviest shapes survive, so the mark carries just two:
    the trace and the point where it settles.

    Three things this has to get right at 6-8 real pixels:
      - the band is a solid fill, since dashed hairlines go sub-pixel;
      - the trace has steep vertical travel, or the curve flattens to a dash;
      - the end dot sits ON the trace's last point with no ink ring between
        them, so it terminates the curve instead of floating beside it.

    Colours are the brand tokens from src/content/site.ts converted to sRGB:
    ink #101A27, accent #00AAA4, crest #25D2C7.
  -->
  <rect width="32" height="32" rx="7" fill="#101A27"/>

  <!-- Acceptance range. Stops short of the right edge so the settled point
       reads as sitting inside it, not past it. -->
  <rect x="5" y="11.5" width="20" height="8.5" rx="1" fill="#00AAA4" opacity="0.24"/>

  <!-- The trace: enters low and below tolerance, climbs steeply through the
       lower limit, flattens onto target. Ends exactly at the dot's centre. -->
  <path d="M5.5 25.5 C 9.5 25, 10 18, 15 16.25 C 18 15.2, 20 15.25, 22.5 15.25"
        fill="none" stroke="#25D2C7" stroke-width="3.25"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Settled reading, concentric with the trace end — same colour, no ring,
       so the two fuse into one continuous mark at every size. -->
  <circle cx="22.5" cy="15.25" r="3.25" fill="#25D2C7"/>
</svg>
